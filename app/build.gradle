plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt' // এটি থাকতে হবে
    // id 'com.google.devtools.ksp' // অথবা kapt এর বদলে ksp ব্যবহার করতে পারেন
}

android {
    ...
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // রুম (Room) ডাটাবেজ এবং অ্যানোটেশন প্রসেসিং
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Hilt বা অন্যান্য ডিপেন্ডেন্সি থাকলে সেগুলোর kapt সঠিক আছে কি না চেক করুন
}
